[package]
name = "serverstat"
description = "Query QuakeWorld servers for settings and client information."
keywords = ["servers", "quake", "quakeworld"]
repository = "https://github.com/quakeworld/serverstat"
authors = ["Viktor Persson <viktor.persson@arcsin.se>"]
version = "0.1.5"
edition = "2024"
license = "MIT"
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**", "/tests/**"]

[dependencies]
anyhow = "1.0.97"
hostport = "0.4.0"
phf = { version = "0.12.1", features = ["macros"] }
quake_infostring = "0.4.0"
quake_serverinfo = "0.11.1"
quake_text = "0.3.0"
thiserror = "2.0.11"
tinyudp = { version = "0.6.0", features = ["tokio"] }

tokio = { optional = true, version = "1.44.1", features = ["macros"] }
serde = { optional = true, version = "1.0.219", features = ["derive"] }
serde_json = { optional = true, version = "1.0.140" }

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
score = []
serde = [
    "dep:serde",
    "dep:serde_json",
    "quake_serverinfo/serde",
    "hostport/serde",
]
tokio = ["dep:tokio"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }
