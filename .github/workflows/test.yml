name: Test

on:
  push:
    branches:
      - main
    paths:
      - 'src/**.rs'
      - 'Cargo.*'
  pull_request:
    paths:
      - 'src/**.rs'
      - 'Cargo.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: "Build and test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features
